version: 1
types:
  - name: BankAccount
    constructor: NewBankAccount
    matchers:
      - name: Name
        getter: GetName
      - name: Balance
        getter: GetBalance
  - name: Email
    constructor: NewEmail
    defaults:
      address:
        pattern: email
    matchers:
      - name: Address
        getter: GetAddress
  - name: Account
    constructor: NewAccount
    matchers:
      - name: User
        getter: GetUser
      - name: Status
        getter: GetStatus
targets:
  - package: .
    types:
      include:
        - Address
        - User
        - Product
        - OrderItem
        - Order
        - BlogPost
        - Comment
        - BankAccount
        - Email
        - Account
        - Profile
        - Team
        - Member
        - Organization
    file_suffix: _gen.go

defaults:
  primitives:
    string: "StringWith('${field_lc}_')"
    int: "Int()"
    int64: "Int64()"
    uint64: "Uint64()"
    bool: "Bool()"
    float64: "Float64()"
    "time.Time": "Time()"
    "time.Duration": "Duration()"

  field_overrides:
    - match: ".*(^|_)id$"
      type: string
      provider: "ID()"
