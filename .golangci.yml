version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert

  disable:
    - depguard
    - dupl  # Disabled because test files naturally have similar structure

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: github.com/james-w/specta

run:
  timeout: 5m
