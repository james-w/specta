version: 2

before:
  hooks:
    # Verify dependencies are correct
    - go mod verify

builds:
  - id: specta
    binary: specta
    main: ./cmd
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Skip combinations that don't make sense
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      # Strip debug info
      - -s -w

archives:
  - id: specta
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: james-w
    name: specta
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## Installation

    Download the appropriate binary for your platform below, or use:

    ```bash
    go install github.com/james-w/specta/cmd@{{ .Tag }}
    ```
