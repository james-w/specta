baseURL = 'https://james-w.github.io/specta/'
languageCode = 'en-us'
title = 'specta'

[params]
  description = "Composable Testing for Go"
  # Color theme: light, dark, or auto (follows browser/OS preference)
  BookTheme = "auto"

  [params.footer]
    copyright = "© 2024 specta"

  [[params.social.list]]
    icon = "github"
    uri = "https://github.com/james-w/specta"
    title = "GitHub"

[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML for gomarkdoc anchor tags
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[menu]
  [[menu.main]]
    name = "Docs"
    url = "/docs/"
    weight = 10
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/james-w/specta"
    weight = 20
