baseURL = 'https://james-w.github.io/specta/'
languageCode = 'en-us'
title = 'specta'
theme = 'doks'

[params]
  description = "Composable Testing for Go"
  github = "https://github.com/james-w/specta"

  [params.doks]
    githubRepo = "https://github.com/james-w/specta"
    docsRepo = "https://github.com/james-w/specta"
    docsRepoBranch = "main"
    docsRepoSubPath = "docs"
    editPage = true
    search = true

[module]
  [[module.imports]]
    path = "github.com/h-enk/doks-core"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[menu]
  [[menu.main]]
    name = "Docs"
    url = "/docs/"
    weight = 10
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/james-w/specta"
    weight = 20
