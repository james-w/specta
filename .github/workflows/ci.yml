name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  actions: read

jobs:
  build-and-test:
    name: Build and Test (Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Build cmd
        run: go build -v -o specta ./cmd/...

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic . ./cmd/...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 30

      - name: Check test coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $coverage%"
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "::warning::Coverage is below 70% (current: $coverage%)"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: specta-binary
          path: specta
          retention-days: 30

  verify-generated:
    name: Verify Generated Files
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: specta-binary

      - name: Make binary executable
        run: chmod +x specta

      - name: Generate test files for example
        working-directory: example
        run: ../specta -config specta.yaml

      - name: Generate test files for showcase
        working-directory: showcase
        run: ../specta -config specta.yaml

      - name: Check generated files match committed versions
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files differ from committed versions. Please run 'go generate ./...' and commit the changes"
            git diff
            exit 1
          fi

  test-example:
    name: Test Example Module
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: specta-binary

      - name: Make binary executable
        run: chmod +x specta

      - name: Generate test files for example
        working-directory: example
        run: ../specta -config specta.yaml

      - name: Run example module tests
        working-directory: example
        run: go test -v -race ./...

  test-showcase:
    name: Test Showcase Module
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.sum
            showcase/go.sum

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: specta-binary

      - name: Make binary executable
        run: chmod +x specta

      - name: Generate test files for showcase
        working-directory: showcase
        run: ../specta -config specta.yaml

      - name: Run showcase module tests
        working-directory: showcase
        run: go test -v -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', 'example', 'showcase']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: ${{ matrix.module }}
          # Only show new issues in PR mode
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          # Automatically adds annotations to the PR
          args: --timeout=5m

  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            echo ""
            echo "Please run 'gofmt -s -w .' to format your code"
            exit 1
          fi

      - name: Run go vet on root module
        run: go vet ./...

      - name: Run go vet on example module
        working-directory: example
        run: go vet ./...

      - name: Run go vet on showcase module
        working-directory: showcase
        run: go vet ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: gosec.sarif

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
