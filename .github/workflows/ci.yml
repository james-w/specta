name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  actions: read

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for goreleaser

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run GoReleaser (snapshot mode)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload all binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 7

      # Upload platform-specific binaries for testing
      - name: Upload Linux AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: specta-linux-amd64
          path: dist/specta_linux_amd64_v1/specta
          retention-days: 7

      - name: Upload Darwin AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: specta-darwin-amd64
          path: dist/specta_darwin_amd64_v1/specta
          retention-days: 7

      - name: Upload Darwin ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: specta-darwin-arm64
          path: dist/specta_darwin_arm64_v8.0/specta
          retention-days: 7

      - name: Upload Windows AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: specta-windows-amd64
          path: dist/specta_windows_amd64_v1/specta.exe
          retention-days: 7

  test-core:
    name: Test Core Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic . ./cmd/...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 30

      - name: Check test coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $coverage%"
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "::warning::Coverage is below 70% (current: $coverage%)"
          fi

  verify-generated:
    name: Verify Generated Files
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: specta-linux-amd64

      - name: Make binary executable
        run: chmod +x specta

      - name: Generate test files for example
        working-directory: example
        run: ../specta -config specta.yaml

      - name: Generate test files for showcase
        working-directory: showcase
        run: ../specta -config specta.yaml

      - name: Check generated files match committed versions
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files differ from committed versions. Please run 'go generate ./...' and commit the changes"
            git diff
            exit 1
          fi

  integration-tests:
    name: Integration Tests (${{ matrix.platform }} / Go ${{ matrix.go-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux with Go 1.22 and 1.23
          - platform: linux-amd64
            os: ubuntu-latest
            artifact: specta-linux-amd64
            go-version: '1.22'
          - platform: linux-amd64
            os: ubuntu-latest
            artifact: specta-linux-amd64
            go-version: '1.23'
          # macOS with Go 1.23 only
          - platform: darwin-arm64
            os: macos-latest
            artifact: specta-darwin-arm64
            go-version: '1.23'
          # Windows with Go 1.23 only
          - platform: windows-amd64
            os: windows-latest
            artifact: specta-windows-amd64
            go-version: '1.23'
            binary-name: specta.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Download binary for ${{ matrix.platform }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Make binary executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x specta

      - name: Generate test files for example
        working-directory: example
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ../specta.exe -config specta.yaml
          else
            ../specta -config specta.yaml
          fi

      - name: Generate test files for showcase
        working-directory: showcase
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ../specta.exe -config specta.yaml
          else
            ../specta -config specta.yaml
          fi

      - name: Run example tests
        working-directory: example
        run: go test -v -race ./...

      - name: Run showcase tests
        working-directory: showcase
        run: go test -v -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', 'example', 'showcase']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          working-directory: ${{ matrix.module }}
          # Only show new issues in PR mode
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          # Automatically adds annotations to the PR
          args: --timeout=5m

  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            echo ""
            echo "Please run 'gofmt -s -w .' to format your code"
            exit 1
          fi

      - name: Run go vet on root module
        run: go vet ./...

      - name: Run go vet on example module
        working-directory: example
        run: go vet ./...

      - name: Run go vet on showcase module
        working-directory: showcase
        run: go vet ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: gosec.sarif

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            go.sum
            example/go.sum
            showcase/go.sum

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
